name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: ./gradlew test

      - name: Upload snapshot outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-actual-${{ matrix.os }}
          path: build/snapshot-actual/
